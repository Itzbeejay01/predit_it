name: BeeHive demo bot tests
on:
  push:
    branches:
      - feature/beehive-mt5-demo-bot
  pull_request:
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline dependencies
        run: python -m pip install -r requirements-beehive.txt
      - name: Run fake-broker unit tests (no live MT5 connection)
        run: python -m unittest discover -s tests -p 'test_beehive*.py' -v
